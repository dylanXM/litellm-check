name: Release

# Builds the sdist + wheel on every v* tag push, validates them with
# `twine check --strict`, uploads them as a workflow artifact, and publishes
# to PyPI via trusted publishing (OIDC, no stored token). The publish job
# requires the `pypi` environment plus a PyPI trusted publisher configured
# for dylanXM/litellm-check (pending publisher: project name litellm-check,
# owner dylanXM, workflow release.yml, environment pypi); until that
# one-time setup is done, the build/validate jobs still run and prove the
# package is healthy.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          litellm-check scan tests/fixtures/negative --fail-on high
          litellm-check scan examples/demo-project --format json --out /tmp/r.json
          python -c "import json; d=json.load(open('/tmp/r.json')); assert d['summary']['by_severity']['critical'] >= 10, d['summary']"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/litellm-check/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
