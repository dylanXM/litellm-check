[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-check"
version = "0.1.0"
description = "Self-audit CLI: scan a codebase and local Python environments for exposure to the compromised LiteLLM v1.107.0 release (PyPI, Docker Hub, GHCR) and generate an evidence report, based solely on LiteLLM's official incident announcement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dylan XM" },
]
keywords = ["litellm", "supply-chain", "security", "scanner", "incident-response", "ioc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dylanXM/litellm-check"
Repository = "https://github.com/dylanXM/litellm-check"
Issues = "https://github.com/dylanXM/litellm-check/issues"
Announcement = "https://docs.litellm.ai/blog/security-incident-oct-21-2026"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
litellm-check = "litellm_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litellm_check = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# fixtures are intentionally dirty sample projects, not real code
extend-exclude = ["tests/fixtures", "examples"]
